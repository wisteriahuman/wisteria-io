name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # バージョンは package.json の packageManager に従う（ADR-002）
      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check
        run: pnpm check

      - name: Deploy
        run: |
          rm -rf /Users/wisteria/portfolio-dist
          cp -r dist /Users/wisteria/portfolio-dist
          echo "Deployed at $(date)"
