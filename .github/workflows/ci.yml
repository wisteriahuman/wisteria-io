name: CI

# 検証は GitHub のマシンで PR と main への push の両方に走らせる。
# デプロイは main への push のときだけ、検証が通った後に自宅の Mac mini で行う（ADR-011）
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # バージョンは package.json の packageManager と .node-version に従う（ADR-002・ADR-012）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 記事の図はビルド時に Chrome で描き、文字幅もそこで測る。日本語のフォントが無いと幅がずれる（ADR-014）
      - name: Install Japanese fonts
        run: fc-list :lang=ja | grep -q . || (sudo apt-get update && sudo apt-get install -y fonts-noto-cjk)

      - name: Verify
        run: pnpm verify

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/reports
          if-no-files-found: ignore

      # 検証したビルド結果を、そのまま本番に出す
      - name: Upload dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: verify
    # 外部の PR のコードを自宅の機械で動かさないため、main への push のときだけ動かす
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    # 続けて merge しても、デプロイが重なったり順番が入れ替わったりしないようにする
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 先に別の場所へ写してから入れ替え、配信中のディレクトリが空になる時間をなくす
      - name: Deploy
        run: |
          set -eu
          target=/Users/wisteria/portfolio-dist
          rm -rf "$target.next" "$target.prev"
          cp -R dist "$target.next"
          if [ -d "$target" ]; then mv "$target" "$target.prev"; fi
          mv "$target.next" "$target"
          rm -rf "$target.prev"
          echo "Deployed at $(date)"
